name: Sync competition conversation material
on:
  push:
    branches:
      - 2026-competition-round2
permissions:
  contents: write
concurrency:
  group: sync-competition-conversation
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2026-competition-round2
          fetch-depth: 0
      - name: Materialize and publish conversation files
        shell: bash
        run: |
          if [ ! -f .minivector/conversation.json.gz ]; then
            echo "Conversation transport is already applied."
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          import gzip
          import hashlib
          import json

          raw = gzip.decompress(Path(".minivector/conversation.json.gz").read_bytes())
          expected = "b570d24a00e0fb3e3832eb8dda106b8cb0f602d68d0ae699fb2b4bbc68d80d47"
          actual = hashlib.sha256(raw).hexdigest()
          if actual != expected:
              raise SystemExit(f"conversation SHA-256 mismatch: {actual}")
          json.loads(raw.decode("utf-8"))
          Path("conversation.json").write_bytes(raw)
          Path("agent").mkdir(parents=True, exist_ok=True)
          Path("agent/conversation.json").write_bytes(raw)
          PY
          rm -f .minivector/conversation.json.gz .github/workflows/sync-competition-conversation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add conversation.json agent/conversation.json .minivector/conversation.json.gz .github/workflows/sync-competition-conversation.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: sync optimized competition conversation material"
          git push origin HEAD:refs/heads/2026-competition-round2
