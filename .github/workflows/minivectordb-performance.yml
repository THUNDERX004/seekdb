name: MiniVectorDB paired Linux benchmark

on:
  push:
    branches: [codex/performance-breakthrough-20261111]
    paths:
      - src/minivectordb.cpp
      - src/*.hpp
      - bench/evaluate.py
      - bench/evaluate_ordinary.py
      - bench/evaluate_vector_phases.py
      - .github/workflows/minivectordb-performance.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Fetch the fixed comparison source
        run: |
          git fetch --no-tags --depth=1 origin ed5b940d70d9ccc4f6ce4742ebe0847514ca3418
          mkdir -p build/paired-linux
          git show ed5b940d70d9ccc4f6ce4742ebe0847514ca3418:src/minivectordb.cpp > build/paired-linux/baseline.cpp
          git show ed5b940d70d9ccc4f6ce4742ebe0847514ca3418:src/compact_value.hpp > build/paired-linux/compact_value.hpp
          git show ed5b940d70d9ccc4f6ce4742ebe0847514ca3418:src/quantized_block_scan.hpp > build/paired-linux/quantized_block_scan.hpp
          git show ed5b940d70d9ccc4f6ce4742ebe0847514ca3418:src/decimal_float.hpp > build/paired-linux/decimal_float.hpp
          git show ed5b940d70d9ccc4f6ce4742ebe0847514ca3418:src/topk_heap.hpp > build/paired-linux/topk_heap.hpp
      - name: Build both versions with the submission compiler
        run: |
          docker run --rm --network=none --mount type=bind,src="$PWD",dst=/work --workdir /work \
            gcc:14.3.0-bookworm@sha256:5e927c284bf55a7dc796262e311a0703344f62f41f5621eb56843111b1d37e15 \
            bash -euc '
              flags="-std=c++20 -O3 -DNDEBUG -Wall -Wextra -Wpedantic -static-libstdc++ -static-libgcc"
              g++ $flags build/paired-linux/baseline.cpp -o build/paired-linux/baseline
              g++ $flags src/minivectordb.cpp -o build/paired-linux/candidate
            '
      - name: Install the independent oracle
        run: python3 -m pip install numpy==2.1.3
      - name: Run serial paired JSON measurements and independent verification
        run: |
          python3 -X utf8 -B bench/evaluate.py \
            --baseline build/paired-linux/baseline --candidate build/paired-linux/candidate \
            --baseline-protocol json --candidate-protocol json \
            --runs 3 --rows 10000 --dim 128 --queries 1000 --batch 100 --k 10 \
            --seed 20261610 --report build/paired-linux/result.json > build/paired-linux/stdout.txt
          python3 -X utf8 -B bench/evaluate.py \
            --baseline build/paired-linux/candidate --candidate build/paired-linux/candidate \
            --baseline-protocol json --candidate-protocol json \
            --runs 3 --rows 10000 --dim 128 --queries 1000 --batch 100 --k 10 \
            --seed 20261610 --report build/paired-linux/default-aa.json > build/paired-linux/default-aa.stdout.txt
          python3 -X utf8 -B bench/evaluate.py \
            --baseline build/paired-linux/baseline --candidate build/paired-linux/candidate \
            --baseline-protocol json --candidate-protocol json \
            --runs 3 --rows 10000 --dim 512 --queries 1000 --batch 100 --k 10 \
            --seed 20261620 --report build/paired-linux/dim512.json > build/paired-linux/dim512.stdout.txt
          python3 -X utf8 -B bench/evaluate.py \
            --baseline build/paired-linux/baseline --candidate build/paired-linux/candidate \
            --baseline-protocol json --candidate-protocol json \
            --runs 3 --rows 1000 --dim 128 --queries 1000 --batch 100 --k 10 \
            --seed 20261630 --report build/paired-linux/small.json > build/paired-linux/small.stdout.txt
          python3 -X utf8 -B bench/evaluate.py \
            --baseline build/paired-linux/candidate --candidate build/paired-linux/candidate \
            --baseline-protocol json --candidate-protocol json \
            --runs 3 --rows 1000 --dim 128 --queries 1000 --batch 100 --k 10 \
            --seed 20261630 --report build/paired-linux/small-aa.json > build/paired-linux/small-aa.stdout.txt
          python3 -X utf8 -B bench/evaluate_ordinary.py \
            --baseline build/paired-linux/baseline --candidate build/paired-linux/candidate \
            --runs 3 --rows 10000 --dim 128 --queries 1000 --batch 100 --k 10 \
            --seed 20261660 --report build/paired-linux/ordinary.json > build/paired-linux/ordinary.stdout.txt
      - name: Run serial large 100k x 128 JSON measurements and independent verification
        run: |
          python3 -X utf8 -B bench/evaluate.py \
            --baseline build/paired-linux/baseline --candidate build/paired-linux/candidate \
            --baseline-protocol json --candidate-protocol json \
            --runs 3 --rows 100000 --dim 128 --queries 1000 --batch 100 --k 10 \
            --seed 20261670 --report build/paired-linux/large.json > build/paired-linux/large.stdout.txt
      - name: Separate cold preparation and warm query measurements
        run: |
          for rows in 10000 100000; do
            python3 -X utf8 -B bench/evaluate_vector_phases.py \
              --baseline build/paired-linux/baseline --candidate build/paired-linux/candidate \
              --rows "$rows" --dim 128 --queries 1000 --runs 5 --aa-runs 2 \
              --seed 20261810 --report build/paired-linux/phases-$rows.json \
              > build/paired-linux/phases-$rows.stdout.txt
          done
      - name: Print comparison evidence
        if: always()
        run: |
          git rev-parse HEAD
          sha256sum src/minivectordb.cpp src/*.hpp \
            build/paired-linux/baseline.cpp build/paired-linux/*.hpp \
            build/paired-linux/baseline build/paired-linux/candidate
          lscpu | head -35
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('build/paired-linux/result.json')
          if not path.exists():
              raise SystemExit('No complete benchmark report')
          report = json.loads(path.read_text())
          for run in report['runs']:
              for result in run['results'].values():
                  result.pop('write_batch_ns', None)
                  result.pop('queries_raw', None)
          print('PAIRED_LINUX_EVIDENCE ' + json.dumps(report, separators=(',', ':')))
          for name in ('default-aa', 'dim512', 'small', 'small-aa', 'large'):
              report = json.loads(Path('build/paired-linux/' + name + '.json').read_text())
              for run in report['runs']:
                  for result in run['results'].values():
                      result.pop('write_batch_ns', None)
                      result.pop('queries_raw', None)
              print('VARIANT_' + name.upper() + '_EVIDENCE ' + json.dumps(report, separators=(',', ':')))
          report = json.loads(Path('build/paired-linux/ordinary.json').read_text())
          report['workload'].pop('queries', None)
          for run in report['runs']:
              for result in run['results'].values():
                  result.pop('write_batch_ns', None)
                  result.pop('queries_raw', None)
          print('ORDINARY_LINUX_EVIDENCE ' + json.dumps(report, separators=(',', ':')))
          for rows in (10000, 100000):
              report = json.loads(Path(f'build/paired-linux/phases-{rows}.json').read_text())
              print(f'PHASES_{rows}_EVIDENCE ' + json.dumps(report, separators=(',', ':')))
          PY
