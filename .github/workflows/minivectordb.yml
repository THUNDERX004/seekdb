name: MiniVectorDB Linux validation

on:
  push:
    branches: [2026-competition-round2, codex/performance-round3-20261111]
    paths:
      - src/minivectordb.cpp
      - tests/**
      - mysqltest/**
      - protocol_check/**
      - STDIO_PROTOCOL.md
      - Dockerfile
      - CMakeLists.txt
      - .github/workflows/minivectordb.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build the submission image
        run: |
          docker build --tag minivectordb:validation .
          mkdir -p build/linux-normal build/linux-scalar build/linux-fault
          container_id=$(docker create minivectordb:validation)
          docker cp "$container_id":/app/minivectordb build/linux-normal/minivectordb
          docker rm "$container_id"
      - name: Build scalar and isolated fault tests
        run: |
          docker run --rm --network=none --mount type=bind,src="$PWD",dst=/work --workdir /work \
            gcc:14.3.0-bookworm@sha256:5e927c284bf55a7dc796262e311a0703344f62f41f5621eb56843111b1d37e15 \
            bash -euc '
              flags="-std=c++20 -static-libstdc++ -static-libgcc"
              g++ $flags -O3 -DNDEBUG -Wall -Wextra -Wpedantic -DMVD_FORCE_SCALAR src/minivectordb.cpp -o build/linux-scalar/minivectordb
              g++ $flags -O3 -DNDEBUG -Wall -Wextra -Wpedantic -DMVD_TEST_FAULTS src/minivectordb.cpp -o build/linux-fault/minivectordb
              g++ $flags -O2 -Wall -Wextra -Wpedantic tests/test_quantized_kernels.cpp -o build/test_quantized_kernels
              for mode in normal scalar; do
                extra=""
                if [ "$mode" = scalar ]; then extra=-DMVD_FORCE_SCALAR; fi
                for kind in statement commit catalog; do
                  g++ $flags -O1 $extra tests/test_${kind}_allocation.cpp -o build/test_${kind}_allocation_${mode}
                done
              done
            '
      - name: Verify every supported integer SIMD kernel against the scalar oracle
        run: build/test_quantized_kernels
      - name: Run the full local correctness contract on Linux
        run: |
          python3 -X utf8 -B tests/validate_all.py \
            --normal build/linux-normal/minivectordb \
            --scalar build/linux-scalar/minivectordb \
            --fault build/linux-fault/minivectordb \
            --allocation-normal build/test_statement_allocation_normal \
            --allocation-scalar build/test_statement_allocation_scalar \
            --commit-allocation-normal build/test_commit_allocation_normal \
            --commit-allocation-scalar build/test_commit_allocation_scalar \
            --catalog-allocation-normal build/test_catalog_allocation_normal \
            --catalog-allocation-scalar build/test_catalog_allocation_scalar \
            --prefix refine-logs/linux-validation
      - name: Run the unchanged official JSONL checker
        run: |
          python3 -X utf8 -B protocol_check/run.py --image minivectordb:validation \
            --handshake-only --output protocol-results/docker-handshake
          python3 -X utf8 -B protocol_check/run.py --image minivectordb:validation \
            --output protocol-results/docker-public
          python3 -X utf8 -B protocol_check/run.py \
            --command '["build/linux-scalar/minivectordb","--data-dir={data_dir}"]' \
            --output protocol-results/scalar-public
      - name: Verify the actual container entrypoint and data mount
        run: |
          python3 -X utf8 -B - <<'PY'
          import json
          import pathlib
          import subprocess
          import tempfile

          with tempfile.TemporaryDirectory(prefix="mvd-image-") as directory:
              command = ["docker", "run", "--rm", "--interactive", "--network=none",
                         "--cpus=2", "--memory=256m", "--mount",
                         "type=bind,src=" + str(pathlib.Path(directory).resolve()) + ",dst=/data",
                         "minivectordb:validation"]
              sessions = [
                  (["CREATE TABLE t(id BIGINT PRIMARY KEY,v VECTOR(2));",
                    "INSERT INTO t VALUES(1,'[3,4]');",
                    "SELECT id,L2_DISTANCE(v,'[0,0]') AS d FROM t ORDER BY d;",
                    "BEGIN;", "DELETE FROM t;"],
                   [{"id":1,"ok":True}, {"id":2,"ok":True,"affected_rows":1},
                    {"id":3,"ok":True,"columns":["id","d"],"rows":[[1,5.0]]},
                    {"id":4,"ok":True}, {"id":5,"ok":True,"affected_rows":1}]),
                  (["SELECT id FROM t;"],
                   [{"id":1,"ok":True,"columns":["id"],"rows":[[1]]}]),
              ]
              for statements, expected in sessions:
                  payload = "".join(json.dumps({"id":index,"op":"execute","sql":sql,
                                               "search_mode":"exact"}) + "\n"
                                    for index, sql in enumerate(statements, 1)).encode()
                  result = subprocess.run(command, input=payload, capture_output=True, timeout=30)
                  messages = [json.loads(line) for line in result.stdout.split(b"\n")[:-1]]
                  if (result.returncode != 0 or not result.stdout.endswith(b"\n") or
                          messages != [{"type":"ready"}] + expected):
                      raise SystemExit(repr((result.returncode, result.stdout, result.stderr)))
              print("PASS: default JSON image startup, SQL, mounted durability and EOF rollback")
          PY
      - name: Verify data larger than the hard memory limit
        run: |
          python3 -X utf8 -B tests/test_container_resources.py --image minivectordb:validation
          python3 -X utf8 -B tests/test_container_resources.py --image minivectordb:validation \
            --memory-mib 64 --dim 1024 --cache-mib 8
      - name: Print versioned validation records
        if: always()
        run: |
          git rev-parse HEAD
          sha256sum src/minivectordb.cpp build/linux-normal/minivectordb
          if [ -f refine-logs/linux-validation.json ]; then
            python3 -c 'import json; p="refine-logs/linux-validation.json"; r=json.load(open(p)); print(r["status"],len(r["runs"])); print([(x["label"],x["returncode"]) for x in r["runs"]])'
          fi
